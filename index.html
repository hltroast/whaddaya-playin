<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">                                                                          <!-- Character set to make sure that odd characters don't break anything-->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">     <!-- Page will only load scripts from my own app files, no security warning in console-->
        <title>Whaddaya Playin'?</title>                                                                <!-- Window title text-->
    </head>
    <body>
        <h1>Whaddaya Playin'?</h1>
        <p>Electron is running.</p>

        <button id="updateBtn">Update Database</button>                                                 <!-- Database update button-->
        <p id="status"></p>

        <h2>Find Similar Games</h2>
        <input id="searchBox" type="text" placeholder="Enter a game name">
        <button id="recommendBtn">Recommend</button>
        <p id="matchedGame"></p>
        <ol id="resultsList"></ol>

        <script src="renderer.js"></script>                                                             <!-- Load the front end after page elements exist-->
    </body>
</html>
