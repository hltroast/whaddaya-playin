<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">                                                                          <!-- Character set to make sure that odd characters don't break anything-->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">     <!-- Page will only load scripts from my own app files, no security warning in console-->
        <title>Whaddaya Playin'?</title>                                                                <!-- Window title text-->
        <link rel="stylesheet" href="styles.css">                                                       <!-- Load the CSS file for styling-->
    </head>
    <body>
        <header>
            <h1 class="logo">Whaddaya Playin'?</h1>
        </header>

        <main>
            <section id="searchColumn">
                <h2>Find Steam Games</h2>
                <input id="searchBox" type="text" placeholder="Enter a game" autocomplete="off">
                <ul id="searchResults"></ul>
            </section>

            <section id="rightColumn">
                <div id="selectedPanel" class="panel">
                    <h2>Currently Selected Games</h2>
                    <p id="emptyMessage">How sad, no games to recommend!</p>
                    <ul id="selectedList"></ul>
                    <button id="recommendBtn" disabled>Recommend</button>
                </div>
                <div id="resultsPanel" class="panel">
                    <p id="matchedGame"></p>
                    <ol id="resultsList"></ol>
                </div>
            </section>
        </main>

        <footer>
            <p>Electron is running.</p>
            <button id="updateBtn">Update Database</button>
            <p id="status"></p>
            <button id="tutorialBtn" title="Tutorial">?</button>
        </footer>
    <img id="mascot" src="assets/mascot.png" alt="">    
        <script src="renderer.js"></script>
    </body>
</html>
